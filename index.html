        :root {

            color: #94a3b8;

            font-size: 16px;
            font-weight: 700;
        }

function totals(identity=''){let bs=all('bet').filter(b=>!identity||b.identity===identity),ms=all('movement').filter(m=>!identity||m.identity===identity);let closed=bs.filter(b=>b.state==='closed');let profit=closed.reduce((a,b)=>a+actual(b),0),fees=identity?0:all('fee').reduce((a,f)=>a+f.amount,0);let funded=ms.reduce((a,m)=>a+(m.kind==='withdrawal'?-m.amount:m.kind==='transfer'?0:m.amount),0);let locked=bs.filter(b=>b.state==='open').reduce((a,b)=>{if(b.kind!=='multi')return a+stakeBase(b)+calculate(b).liability;return a+stakeBase(b)+b.legs.filter(l=>l.locked&&l.status==='pending').reduce((s,l)=>s+l.amount*(l.fixedLay-1),0);},0);let ongoingExchange=bs.filter(b=>b.state==='open'&&b.kind==='multi').reduce((a,b)=>a+calculate(b).exchange,0);return {profit,fees,balance:funded+profit-fees+ongoingExchange-locked,locked,open:bs.filter(b=>b.state==='open').length,bs};}

<section class="calculator-card"><h2 class="section-head">Movimenti della cassa</h2><p class="muted">Registra il saldo iniziale di ciascun account, versamenti, prelievi e trasferimenti.</p><div class="actions" style="margin-top:18px">${button('Aggiungi movimento','movement','primary')}${button('Saldi per account','balances')}</div></section></div><section class="calculator-card"><div class="page-head"><h2 class="section-head">Andamento annuale</h2><span class="muted">${new Date().getFullYear()}</span></div><div class="table-wrap"><table><thead><tr><th>Mese</th><th>Risultato</th><th>Abbonamento</th><th>Netto</th></tr></thead><tbody>${Array.from({length:12},(_,i)=>{let m=new Date().getFullYear()+'-'+String(i+1).padStart(2,'0'),p=t.bs.filter(b=>b.state==='closed'&&b.settledDate?.startsWith(m)).reduce((s,b)=>s+actual(b),0),f=homeIdentity?0:all('fee').filter(f=>f.month===m).reduce((s,f)=>s+f.amount,0);return `<tr><td>${new Date(2026,i,1).toLocaleString('it-IT',{month:'long'})}</td><td>${euro(p)}</td><td>${euro(f)}</td><td>${signed(p-f)}</td></tr>`;}).join('')}</tbody></table></div></section>`;}
function calculator(){let d=draft,locked=d.kind==='multi'&&d.legs.some(l=>l.locked);return `<section class="calculator-card"><div class="calc-types">${Object.entries(kinds).map(([k,v])=>button(v,'new',k===d.kind?'selected':'',`data-kind="${k}"`)).join('')}</div><div class="header"><h1>Calcolatore ${kinds[d.kind]}</h1><p>${archive.get(d.id)?'Modifica giocata salvata':'Inserisci i parametri della giocata'}</p></div><div class="tabs">${(d.kind==='multi'?['normal','refund','one']:['normal','refund','free']).map(m=>`<button class="tab-btn ${m===d.mode?'active':''}" data-action="mode" data-mode="${m}" ${locked?'disabled':''}>${modes[m]}</button>`).join('')}</div>${d.kind==='pp'?'<div class="notice">Usa due selezioni opposte che coprono tutti gli esiti, senza sovrapposizioni. I due account sono considerati senza commissioni.</div>':''}<div class="grid-inputs"><div class="input-card bookmaker"><div class="section-title">Bookmaker ${d.kind==='pp'?'1':''} (Punta)</div>${field(d.mode==='free'?'Importo Freebet (€)':'Importo puntata (€)','stake',d.stake,'number',locked?'disabled':'')}${d.kind!=='multi'?field('Quota punta','back',d.back):''}${['refund','one'].includes(d.mode)?field('Rimborso in denaro (€)','refund',d.refund,'number',locked?'disabled':''):''}</div><div class="input-card exchange"><div class="section-title">${d.kind==='pp'?'Bookmaker 2 (Copertura)':'Exchange (Banca)'}</div>${d.kind!=='multi'?field(d.kind==='pp'?'Quota punta opposta':'Quota banca','lay',d.lay):'<p class="muted" style="margin-bottom:12px">La quota banca si inserisce per ciascun incontro.</p>'}${d.kind!=='pp'?field('Commissione Exchange (%)','comm',d.comm):'<p class="muted">La seconda puntata viene calcolata automaticamente.</p>'}</div></div>${d.mode==='free'?'<p class="notice">Freebet senza restituzione dell’importo giocato. Il valore nominale non viene sottratto dalla cassa.</p>':''}${d.kind==='multi'&&d.mode==='refund'?'<p class="notice">Al primo incontro perso la multipla si conclude: il rimborso è incluso nel risultato e gli incontri successivi vengono bloccati.</p>':''}${d.mode==='one'?'<p class="notice">Rimborso soltanto con esattamente un incontro perso. Dopo il primo errore si ricalcola la copertura per conservare il rimborso; dopo il secondo, la multipla si conclude senza rimborso e gli incontri successivi vengono bloccati.</p>':''}${d.kind==='multi'?`<div class="page-head"><h2 class="section-head">Incontri <span class="muted">${d.legs.length} / 7</span></h2>${button('+ Aggiungi incontro','add-leg','',d.legs.length>=7||locked?'disabled':'')}</div>${d.legs.map((l,i)=>`<div class="leg match-card match-tone-${i+1} ${blockedLeg(d,i)?'match-blocked':''}"><fieldset class="match-fields" ${blockedLeg(d,i)?'disabled':''} aria-label="Incontro ${i+1}"><div class="leg-head"><span>Incontro ${i+1} ${l.locked?'<span class="pill">Copertura confermata</span>':''}</span>${button('Rimuovi','remove-leg','',`data-index="${i}" ${d.legs.length<=2||locked?'disabled':''}`)}</div><div class="leg-grid">${field('Squadre / Evento',`legs.${i}.match`,l.match,'text')}${field('Data e ora',`legs.${i}.date`,l.date,'datetime-local')}${field('Mercato / Selezione',`legs.${i}.market`,l.market,'text')}${select('Esito selezione',`legs.${i}.status`,l.status,[['pending','Da disputare'],['win','Vinta'],['lose','Persa']],!l.locked?'disabled':'')}${field('Quota punta',`legs.${i}.back`,l.back,'number',locked?'disabled':'')}${field('Quota banca',`legs.${i}.lay`,l.lay,'number',l.locked?'disabled':'')}${l.locked?`<div class="field"><label>Bancata effettuata</label><strong>${euro(l.amount)}</strong><span class="subtle">Quota ${num(l.fixedLay)} · commissione ${num(l.fixedComm)}%</span></div>`:''}</div><div class="coverline" id="leg-result-${i}"></div></fieldset></div>`).join('')}<p class="subtle">Coperture sequenziali: il risultato dell’incontro precedente deve essere noto prima di coprire il successivo. Non usare il piano per incontri sovrapposti. Eventi annullati e quote parzialmente abbinate richiedono una gestione separata.</p>`:''}<div id="results"></div><button class="btn-save" data-action="save-dialog">${archive.get(d.id)?'Salva modifiche':'Salva giocata'}</button></section>`;}
function updateResults(){try{lastResult=calculate(draft);let r=lastResult,d=draft;$('#results').innerHTML=`${r.stopped?'<div class="notice">'+stopMessage(d)+' Gli incontri successivi sono bloccati. Salva le modifiche per aggiornare l’archivio e la cassa.</div>':''}${r.warnings?.map(w=>`<div class="notice warn">${w}</div>`).join('')||''}<div class="profit-banner ${r.min<0?'negative':'positive'}"><div class="title">${r.done?'Risultato finale':'Risultato minimo stimato'}</div><div class="amount">${euro(r.min)}</div>${d.kind==='multi'?`<div class="muted">Massimo stimato ${euro(r.max)} · ${r.failed} incontri persi</div>`:''}</div><div class="metric-grid"><div class="metric-box"><div class="metric-label">${d.mode==='free'?'Conversione':'Rating'}</div><div class="metric-val">${num(r.rating)}%</div></div><div class="metric-box"><div class="metric-label">${d.kind==='multi'?'Quota multipla':d.kind==='pp'?'Seconda puntata':'Bancata'}</div><div class="metric-val" style="color:#2563eb">${d.kind==='multi'?num(r.total):euro(r.cover)}</div></div><div class="metric-box"><div class="metric-label">${d.kind==='multi'?'Exchange concluso':d.kind==='pp'?'Totale puntate':'Responsabilità'}</div><div class="metric-val">${euro(d.kind==='multi'?r.exchange:d.kind==='pp'?r.cover+(d.mode==='free'?0:d.stake):r.liability)}</div></div></div>${d.kind!=='multi'?`<div class="table-wrap"><table><thead><tr><th>Scenario</th><th>Bookmaker</th><th>${d.kind==='pp'?'Copertura':'Exchange'}</th><th>Totale</th></tr></thead><tbody><tr><td>Vince la prima selezione</td><td>${signed(d.stake*(d.back-1))}</td><td>${signed(-r.liability)}</td><td>${signed(r.win)}</td></tr><tr><td>Perde la prima selezione</td><td>${signed(-stakeBase(d)+(d.mode==='refund'?d.refund:0))}</td><td>${signed(d.kind==='pp'?r.cover*(d.lay-1):r.cover*(1-d.comm/100))}</td><td>${signed(r.lose)}</td></tr></tbody></table></div>`:''}<p class="subtle" style="margin-bottom:18px">Importi arrotondati ai centesimi. Il risultato dipende dalle quote effettivamente abbinate e dalle condizioni della promozione.</p>`;
 if(d.kind==='multi')d.legs.forEach((l,i)=>{let el=$('#leg-result-'+i),row=r.rows[i];if(blockedLeg(d,i)){el.innerHTML='<span class="muted">Incontro bloccato · '+stopMessage(d)+'</span>';return;}el.innerHTML=row?`<span>Bancata: <strong style="color:#2563eb">${euro(row.cover)}</strong></span><span>Responsabilità: <strong>${euro(row.liability)}</strong></span>${!l.locked?button('Conferma copertura','lock','primary',`data-index="${i}"`):button('Correggi copertura','unlock','',`data-index="${i}"`)}`:'<span class="muted">La copertura verrà proposta dopo il risultato precedente.</span>';});
 }catch(e){lastResult=null;$('#results').innerHTML=`<div class="notice error">${esc(e.message)}</div>`;if(draft.kind==='multi')draft.legs.forEach((l,i)=>{let el=$('#leg-result-'+i);if(el)el.innerHTML=l.locked?button('Correggi copertura','unlock','',`data-index="${i}"`):'';});}}
function readSaveForm(form){
 for(const input of form.querySelectorAll('[data-path]'))setDraft(input.dataset.path,input.type==='number'?Number(input.value):input.value);
}
function validateSave(d){
 if(multiStop(d)>=0)d.state='closed';
 const result=calculate(d);
 if(d.book===d.coverBook)throw Error('Seleziona due account distinti per puntata e copertura.');
 if(!knownAccounts().identities.includes(d.identity)||!knownAccounts().books.includes(d.book)||!knownAccounts().books.includes(d.coverBook))throw Error('Seleziona identità e account configurati.');
 if(d.state==='draft'){
  if(!d.date)d.date=today();
  if(!d.match.trim())d.match=d.kind==='multi'?'Multipla ('+d.legs.length+' incontri)':kinds[d.kind]+' · Bozza';
 }else{
  if(!d.date)throw Error('Inserisci data e ora della giocata.');
  if(!d.match.trim())throw Error(d.kind==='multi'?'Inserisci il nome della multipla.':'Inserisci le squadre o il nome dell’evento.');
  if(d.kind==='multi'){
   const incomplete=d.legs.map((l,i)=>!blockedLeg(d,i)&&(!l.match.trim()||!l.market.trim()||!l.date)?i+1:null).filter(Boolean);
   if(incomplete.length)throw Error('Completa squadre, data e selezione degli incontri: '+incomplete.join(', ')+'. I campi sono qui sotto.');
  }else if(!d.market.trim())throw Error('Inserisci il mercato o la selezione della giocata.');
 }
 if(d.kind==='multi'&&d.state==='closed'&&!result.done)throw Error('La multipla non è ancora conclusa: scegli Bozza o In corso, oppure registra gli esiti.');
 if(d.state==='closed'&&!d.settledDate)throw Error('Inserisci la data del risultato.');
 return result;
}
function saveDialog(){

 try{lastResult=calculate(draft);}catch(e){toast(e.message);return;}
 let d=draft;
 saveFields=true;
 modal(`<h2>${archive.get(d.id)?'Aggiorna giocata':'Salva giocata'}</h2><div class="notice">${kinds[d.kind]} · ${modes[d.mode]} · Puntata ${euro(d.stake)} · ${['refund','one'].includes(d.mode)?'Rimborso '+euro(d.refund)+' · ':''}Risultato ${lastResult.done?'finale':'stimato'} ${euro(lastResult.min)}</div><form id="saveForm" novalidate><div id="saveError" class="notice error" role="alert" hidden></div><div class="grid">${select('Identità','identity',d.identity,config().identities)}${select('Tipo di scommessa','category',d.category,['Qualificante','Freebet','Bonus','Quota Maggiorata','Boost','Rimborso'])}${select('Bookmaker','book',d.book,config().books)}${select(d.kind==='pp'?'Bookmaker di copertura':'Account Exchange','coverBook',d.coverBook,config().books)}${field(d.kind==='multi'?'Data e ora registrazione':'Data e ora evento','date',d.date,'datetime-local')}${field(d.kind==='multi'?'Nome della multipla':'Squadre / Evento','match',d.match,'text')}${d.kind!=='multi'?field('Mercato / Selezione','market',d.market,'text'):''}${select('Stato','state',d.state,[['draft','Bozza'],['open','In corso'],['closed','Conclusa']])}${d.kind!=='multi'?select('Esito (se conclusa)','outcome',d.outcome,[['win','Prima selezione vinta'],['lose','Prima selezione persa']]):''}${field('Data risultato (se conclusa)','settledDate',d.settledDate,'date')}</div><p class="subtle">In Bozza puoi salvare il calcolo anche senza aver completato i dettagli degli eventi. Per le giocate In corso o Concluse completa i campi richiesti.</p>${d.kind==='multi'?d.legs.map((l,i)=>blockedLeg(d,i)?`<p class="subtle">Incontro ${i+1}: escluso dalla compilazione perché la multipla è già conclusa.</p>`:`<section class="leg match-card match-tone-${i+1}"><h3 class="section-head">Incontro ${i+1}</h3><div class="grid">${field('Squadre / Evento',`legs.${i}.match`,l.match,'text')}${field('Data e ora',`legs.${i}.date`,l.date,'datetime-local')}${field('Mercato / Selezione',`legs.${i}.market`,l.market,'text')}</div></section>`).join(''):''}<div class="field"><label for="notes">Note</label><textarea id="notes" data-path="notes">${esc(d.notes)}</textarea></div><div class="actions">${button('Annulla','close')}<button class="btn primary" type="submit">Conferma salvataggio</button></div></form>`);
 saveFields=false;
}

function bets(){let list=archive.all().filter(x=>x.type==='bet'&&!!x.deleted===betFilters.trash).filter(b=>(!betFilters.kind||b.kind===betFilters.kind)&&(!betFilters.identity||b.identity===betFilters.identity)&&(!betFilters.state||b.state===betFilters.state)&&(!betFilters.month||b.date.startsWith(betFilters.month))&&(!betFilters.search||JSON.stringify([b.match,b.book,b.legs]).toLowerCase().includes(betFilters.search.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));return `<section class="agenda-card"><div class="page-head"><div><h1>${betFilters.trash?'Cestino':'Le tue giocate'}</h1><p class="muted">${list.length} giocate · dettagli, esiti e coperture</p></div>${button(betFilters.trash?'Torna alle giocate':'Cestino','trash')}</div><div class="filters"><input class="filter" id="searchBets" placeholder="Cerca evento o bookmaker" aria-label="Cerca giocate" value="${esc(betFilters.search)}"><select class="filter" data-filter="kind" aria-label="Tipo calcolatore"><option value="">Tutti i calcolatori</option>${Object.entries(kinds).map(([k,v])=>`<option value="${k}" ${betFilters.kind===k?'selected':''}>${v}</option>`).join('')}</select><select class="filter" data-filter="identity" aria-label="Identità"><option value="">Tutte le identità</option>${knownAccounts().identities.map(i=>`<option ${i===betFilters.identity?'selected':''}>${esc(i)}</option>`).join('')}</select><select class="filter" data-filter="state" aria-label="Stato"><option value="">Tutti gli stati</option>${Object.entries(states).map(([k,v])=>`<option value="${k}" ${betFilters.state===k?'selected':''}>${v}</option>`).join('')}</select><input class="filter" type="month" data-filter="month" value="${betFilters.month}" aria-label="Mese"></div><div class="agenda-list">${list.length?list.map(b=>{let r=calculate(b),v=b.state==='closed'?actual(b):r.min;return `<article class="bet-row ${b.kind}"><div class="col-book"><span class="date-pill">${esc(b.date.replace('T',' '))}</span><div class="tag-box"><span class="badge badge-type ${b.kind}">${kinds[b.kind]}</span></div><strong>${esc(b.identity)}</strong><span class="muted">${esc(b.book)} · ${esc(b.coverBook)}</span></div><div class="col-evento"><div class="match-box">${esc(b.match)}</div><span>${esc(b.kind==='multi'?b.legs.length+' incontri · '+modes[b.mode]:b.market)}</span><span class="muted">${esc(b.category)}</span></div><div class="col-stato"><span class="badge state">${states[b.state]}</span><div class="amounts-row"><span class="amt-chip">PUNTATA ${euro(b.stake)}</span></div></div><div class="col-guadagno ${v<0?'neg':'pos'}">${euro(v)}<small>${b.state==='closed'?'Risultato effettivo':'Stima, non realizzata'}</small></div><div class="actions">${b.deleted?button('Ripristina','restore','',`data-id="${b.id}"`):button('Apri / Modifica','edit','primary',`data-id="${b.id}"`)+button('Duplica','duplicate','',`data-id="${b.id}"`)+button('Elimina','delete','danger',`data-id="${b.id}"`)}</div></article>`;}).join(''):`<div class="empty"><strong>${betFilters.trash?'Il cestino è vuoto':'Nessuna giocata da mostrare'}</strong>Le giocate salvate nei calcolatori appariranno qui.</div>`}</div></section>`;}
function settings(){let c=config();return `<section class="calculator-card"><div class="page-head"><h1>Impostazioni</h1></div><section class="settings-section"><h2>Il tuo archivio Google Drive</h2><p class="notice">Collega il tuo account Google: giocate, identità, bookmaker, movimenti e abbonamenti saranno salvati nel tuo Drive personale. Su PC e cellulare usa lo stesso link e lo stesso account. Il primo collegamento unisce i dati locali con quelli già presenti su Drive.</p><div id="driveError" class="notice error" role="alert" hidden></div><div class="notice ${drive.token?'':'warn'}">${drive.token?'Google Drive collegato. I dati vengono sincronizzati ogni minuto e dopo i salvataggi.':drive.client?'Collega Google Drive per sincronizzare questo dispositivo.':'Salvataggio locale attivo. Google Drive richiede la configurazione iniziale dell’app Google: la sincronizzazione non è ancora attiva.'}</div><div class="sum-row"><span>Account associato</span><strong>${esc(localStorage.getItem('cm-google-account')||'Nessuno')}</strong></div><div class="sum-row"><span>Ultima sincronizzazione riuscita</span><strong>${drive.last?new Date(drive.last).toLocaleString('it-IT'):'Mai'}</strong></div><div class="actions" style="margin:16px 0">${button('Collega Google Drive','connect','primary')}${button('Sincronizza ora','sync','',drive.token?'':'disabled')}${button('Disconnetti','disconnect','',drive.token?'':'disabled')}</div><p class="subtle">Usa lo stesso account Google su PC e cellulare. Le modifiche locali rimangono salvate quando sei offline. Il collegamento può richiedere una nuova autorizzazione alla riapertura.</p>${!DRIVE_CLIENT_ID?`<details style="margin-top:16px"><summary>Configurazione Google · solo gestore</summary><p>Il gestore dell’app deve creare un Client OAuth di tipo “Applicazione web”, abilitare Google Drive API e autorizzare questa origine: <strong>${esc(location.origin)}</strong>. L’autorizzazione richiesta è limitata ai dati dell’app. Non inserire un client secret.</p><div class="field"><label for="clientId">Client ID Google</label><input id="clientId" type="text" value="${esc(drive.client)}" placeholder="…apps.googleusercontent.com"></div>${button('Salva configurazione Google','save-client')}<p class="subtle">Per una distribuzione ad altre persone va completata anche la configurazione del consenso Google. I dati sono nello spazio riservato all’app, non in un foglio visibile in Drive.</p>${button('Scarica app configurata per i clienti','download-configured','primary')}<p class="subtle">Dopo aver verificato il collegamento, scarica questa copia e pubblicala come index.html sullo stesso sito. Contiene soltanto il Client ID pubblico: nessuna giocata, account personale o autorizzazione. Per tutti i clienti devi usare lo stesso progetto Google. In Google Cloud completa il pubblico dell’app; durante i test aggiungi gli account autorizzati.</p></details>`:''}</section><section class="settings-section"><h2>Backup e recupero</h2><div class="actions">${button('Esporta backup completo','export')}${button('Esporta giocate CSV','csv')}${button('Importa backup','import')}</div><input type="file" id="backupInput" class="hidden" accept="application/json,.json"><p class="subtle">Il backup include giocate, impostazioni, movimenti e cestino. L’importazione unisce gli archivi e conserva le modifiche in conflitto. Conserva una copia prima di cancellare i dati del browser.</p></section><section class="settings-section"><h2>Identità e account di gioco</h2><form id="configForm" novalidate><div id="configError" class="notice error" role="alert" hidden></div><div class="grid"><div class="field"><label for="identities">Identità, una per riga</label><textarea id="identities" required>${esc(c.identities.join('\n'))}</textarea></div><div class="field"><label for="books">Bookmaker / Exchange, uno per riga</label><textarea id="books" required>${esc(c.books.join('\n'))}</textarea></div><div class="field"><label for="defaultCommission">Commissione Exchange predefinita (%)</label><input id="defaultCommission" type="number" min="0" max="99.99" step=".01" value="${c.commission}" required></div></div><p class="subtle">Un nome per riga. Le modifiche valgono per le nuove giocate: giocate e movimenti già salvati mantengono i nomi originali, disponibili nei filtri e nei saldi dello storico.</p><button class="btn primary" type="submit">Salva impostazioni</button></form></section><section class="settings-section"><h2>Abbonamento mensile condiviso</h2><form id="feeForm"><div class="grid"><div class="field"><label for="feeMonth">Mese</label><input type="month" id="feeMonth" value="${today().slice(0,7)}" required></div><div class="field"><label for="feeAmount">Costo unico per tutte le identità (€)</label><input type="number" min="0" step=".01" id="feeAmount" value="${archive.get('fee-'+today().slice(0,7))?.amount||0}" required></div></div><button class="btn primary" type="submit">Salva abbonamento</button></form><p class="subtle">Una sola voce per mese, sottratta dal totale complessivo. Non viene duplicata per identità o bookmaker.</p></section></section>`;}
function movementDialog(){modal(`<h2>Movimento della cassa</h2><form id="movementForm"><div class="grid">${select('Identità','mIdentity',config().identities[0],config().identities)}${select('Account','mBook',config().books[0],config().books)}${select('Tipo movimento','mKind','initial',[['initial','Saldo iniziale'],['deposit','Versamento'],['withdrawal','Prelievo'],['transfer','Trasferimento tra account']])}${field('Importo (€)','mAmount','','number','required min="0.01"')}${field('Data','mDate',today().slice(0,10),'date','required')}${select('Account destinazione (trasferimenti)','mTo',config().books[1],config().books)}${field('Nota','mNote','','text')}</div><div class="actions">${button('Annulla','close')}<button type="submit" class="btn primary">Registra</button></div></form>`);}
function balancesDialog(){const ms=all('movement'),bs=all('bet');let rows=[];for(const identity of knownAccounts().identities)for(const book of knownAccounts().books){let value=0;for(const m of ms.filter(m=>m.identity===identity)){if(m.book===book)value+=m.kind==='withdrawal'||m.kind==='transfer'?-m.amount:m.amount;if(m.kind==='transfer'&&m.to===book)value+=m.amount;}for(const b of bs.filter(b=>b.identity===identity)){if(b.state==='closed'){let [a,c]=split(b);if(b.book===book)value+=a;if(b.coverBook===book)value+=c;}else if(b.state==='open'){if(b.book===book)value-=stakeBase(b);if(b.coverBook===book)value+=b.kind==='multi'?calculate(b).exchange-b.legs.filter(l=>l.locked&&l.status==='pending').reduce((a,l)=>a+l.amount*(l.fixedLay-1),0):-calculate(b).liability;}}rows.push(`<tr><td>${esc(identity)}</td><td>${esc(book)}</td><td>${signed(value)}</td></tr>`);}modal(`<h2>Saldi disponibili per account</h2><div class="table-wrap"><table><thead><tr><th>Identità</th><th>Account</th><th>Disponibile</th></tr></thead><tbody>${rows.join('')}</tbody></table></div><p class="subtle">L’abbonamento condiviso è sottratto solo dal riepilogo complessivo, non dai singoli account.</p><h3 style="margin-top:20px">Movimenti registrati</h3>${ms.length?ms.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<div class="sum-row"><span>${esc(m.date)} · ${esc(m.identity)} · ${esc(m.book)}<br><small>${{initial:'Saldo iniziale',deposit:'Versamento',withdrawal:'Prelievo',transfer:'Trasferimento'}[m.kind]} ${m.kind==='transfer'?'→ '+esc(m.to):''} · ${euro(m.amount)}</small></span>${button('Elimina','delete-movement','danger',`data-id="${m.id}"`)}</div>`).join(''):'<p class="empty">Nessun movimento.</p>'}<div class="actions">${button('Chiudi','close')}</div>`);}
function exportFile(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function saveData(d,parents){archive.put(d,parents);if(drive.token)drive.sync().catch(e=>toast(e.message));}
function openConflict(){let entry=Object.entries(archive.heads()).find(([id,h])=>h.length>1);if(!entry){close();render();return;}let [id,heads]=entry;modal(`<h2>Modifiche contemporanee</h2><p class="notice warn">Scegli la versione da mantenere. Le altre rimangono nel backup storico. Nessuna versione viene scelta automaticamente.</p>${heads.map((h,i)=>`<section class="leg"><strong>Versione ${i+1} · ${new Date(h.at).toLocaleString('it-IT')}</strong><p class="muted">${esc(h.data.match||h.data.type)} ${h.data.deleted?'· eliminata':''}</p><details><summary>Mostra tutti i dati</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(h.data,null,2))}</pre></details>${button('Conserva questa versione','resolve','primary',`data-op="${h.id}"`)}</section>`).join('')}<div class="actions">${button('Decidi più tardi','close')}</div>`);}
function setDraft(path,value){let p=path.split('.'),o=draft;
 if(p[0]==='legs'&&blockedLeg(draft,Number(p[1])))return;
 if(p[0]==='legs'&&p[2]==='status'&&draft.kind==='multi'&&value==='lose'&&draft.legs.slice(0,Number(p[1])).filter(l=>l.status==='lose').length+1>=stopAfterLosses(draft)&&draft.legs.slice(Number(p[1])+1).some(l=>l.locked&&l.amount>0)){toast('Ci sono bancate successive già registrate: correggi prima quelle coperture, senza cancellare operazioni effettive.');return;}
 for(const k of p.slice(0,-1))o=o[k];let previous=o[p.at(-1)];o[p.at(-1)]=value;
 if(draft.kind==='multi'&&(path.endsWith('.status')||path==='state')){
  if(multiStop(draft)>=0){draft.state='closed';if(previous!==value&&path.endsWith('.status'))draft.settledDate=today().slice(0,10);}
  else if(path.endsWith('.status')&&draft.state==='closed'&&draft.legs.some(l=>l.status==='pending'))draft.state='open';
 }dirty=true;}

function newCalc(kind){if(dirty&&!confirm('Lasciare il calcolatore senza salvare le modifiche?'))return;draft=fresh(kind);editParents=[];dirty=false;location.hash='calculator';render();}
document.addEventListener('input',e=>{const settingsForm=e.target.closest('#configForm');if(settingsForm)settingsForm.dataset.dirty='true';if(e.target.dataset.path&&!e.target.closest('#movementForm, #lockForm')){let t=e.target;setDraft(t.dataset.path,t.type==='number'?Number(t.value):t.value);if(location.hash==='#calculator')updateResults();}});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.path&&!t.closest('#movementForm, #lockForm')){setDraft(t.dataset.path,t.type==='number'?Number(t.value):t.value);if(t.dataset.path.endsWith('.status'))render();else if(location.hash==='#calculator')updateResults();}if(t.id==='homeIdentity'){homeIdentity=t.value;render();}if(t.dataset.filter){betFilters[t.dataset.filter]=t.value;render();}if(t.id==='searchBets'){betFilters.search=t.value;render();}if(t.id==='feeMonth')$('#feeAmount').value=archive.get('fee-'+t.value)?.amount||0;if(t.id==='backupInput'&&t.files[0]){t.files[0].text().then(s=>{let data=JSON.parse(s);if(data.format!=='codex-matematico-v1')throw Error('Formato backup non riconosciuto.');archive.merge(data.operations);archive.changed();render();toast('Backup importato.');if(drive.token)drive.sync().catch(e=>toast(e.message));}).catch(e=>toast(e.message));}});
document.addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;try{
 if(a==='new')newCalc(b.dataset.kind);
 if(a==='mode'){draft.mode=b.dataset.mode;dirty=true;render();}
 if(a==='add-leg'){if(draft.legs.length<7&&!draft.legs.some(l=>l.locked)){draft.legs.push(leg());dirty=true;render();}}
 if(a==='remove-leg'){if(draft.legs.length>2&&!draft.legs.some(l=>l.locked)){draft.legs.splice(+b.dataset.index,1);dirty=true;render();}}
 if(a==='lock'){if(blockedLeg(draft,+b.dataset.index))return;let i=+b.dataset.index,l=draft.legs[i],row=lastResult?.rows[i];if(!row)return;modal(`<h2>Conferma copertura · incontro ${i+1}</h2><p class="notice">Registra soltanto una bancata realmente abbinata. Se non hai bancato, inserisci zero. I calcoli futuri useranno questi valori fissi.</p><form id="lockForm" data-index="${i}"><div class="grid">${field('Bancata abbinata (€)','lockedAmount',row.cover,'number','required')}${field('Quota effettiva','lockedQuote',l.lay,'number','required')}${field('Commissione (%)','lockedComm',draft.comm,'number','required')}</div><div class="actions">${button('Annulla','close')}<button class="btn primary" type="submit">Conferma</button></div></form>`);}
 if(a==='unlock'){if(blockedLeg(draft,+b.dataset.index))return;let i=+b.dataset.index;if(confirm('Correggere la copertura? Gli esiti successivi saranno riportati a “Da disputare”, le bancate confermate resteranno registrate.')){draft.legs.slice(i).forEach(l=>l.status='pending');draft.legs[i].locked=false;if(draft.state==='closed')draft.state='open';dirty=true;render();}}
 if(a==='save-dialog')saveDialog();if(a==='close')close();
 if(a==='edit'||a==='duplicate'){let data=archive.get(b.dataset.id);if(!data)return;draft=structuredClone(data);editParents=(archive.heads()[data.id]||[]).map(o=>o.id);if(a==='duplicate'){draft.id=crypto.randomUUID();draft.state='draft';draft.date=today();draft.legs.forEach(l=>{l.locked=false;l.status='pending';l.amount=0;});editParents=[];}dirty=false;location.hash='calculator';render();}
 if(a==='delete'||a==='delete-movement'){let data=archive.get(b.dataset.id);if(confirm('Spostare questa voce nel cestino? Il riepilogo della cassa verrà aggiornato.')){saveData({...data,deleted:true});render();if(a==='delete-movement')balancesDialog();}}
 if(a==='restore'){saveData({...archive.get(b.dataset.id),deleted:false});render();}
 if(a==='trash'){betFilters.trash=!betFilters.trash;render();}
 if(a==='movement')movementDialog();if(a==='balances')balancesDialog();
 if(a==='connect'){b.disabled=true;await drive.connect();render();toast('Archivio sincronizzato con Google Drive.');}
 if(a==='sync'){if(!drive.token){location.hash='settings';render();toast('Collega Google Drive dalle impostazioni.');}else{await drive.sync();render();toast('Sincronizzazione completata.');}}
 if(a==='disconnect'){drive.disconnect();render();}
 if(a==='save-client'){let v=$('#clientId').value.trim();if(!validClient(v))throw Error('Inserisci un Client ID Google valido.');if(drive.busy||drive.connecting)throw Error('Attendi la fine dell’operazione Google.');if(drive.token)drive.disconnect();drive.client=v;localStorage.setItem('cm-google-client',v);toast('Configurazione salvata. Ora puoi collegare Google Drive.');render();}
 if(a==='download-configured'){exportFile('index.html',distributionHtml(drive.client),'text/html');toast('Copia configurata scaricata. Pubblicala sul sito per i clienti.');}
 if(a==='export')exportFile('CodexMatematico-backup-'+today().slice(0,10)+'.json',JSON.stringify({format:'codex-matematico-v1',operations:archive.ops},null,2),'application/json');
 if(a==='csv'){const safe=x=>'"'+String(x??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';let rows=[['Data','Identità','Bookmaker','Copertura','Calcolatore','Modalità','Evento','Stato','Puntata','Risultato','Tipo risultato'],...all('bet').map(b=>[b.date,b.identity,b.book,b.coverBook,kinds[b.kind],modes[b.mode],b.match,states[b.state],b.stake,b.state==='closed'?actual(b):calculate(b).min,b.state==='closed'?'Effettivo':'Stimato'])];exportFile('CodexMatematico-giocate.csv','\uFEFF'+rows.map(r=>r.map(safe).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
 if(a==='import')$('#backupInput').click();if(a==='conflicts')openConflict();
 if(a==='resolve'){let op=archive.ops.find(o=>o.id===b.dataset.op);saveData(op.data);openConflict();render();}
 if(a==='onboard-local'){localStorage.setItem('cm-onboarded','yes');close();}
 if(a==='onboard-drive'){localStorage.setItem('cm-onboarded','yes');close();location.hash='settings';render();}
 }catch(err){const box=$('#driveError');if(box&&['connect','sync','save-client','download-configured'].includes(a)){box.textContent=err.message;box.hidden=false;}toast(err.message);}finally{if(b.isConnected)b.disabled=false;}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target;try{
 if(f.id==='saveForm'){
  readSaveForm(f);validateSave(draft);
  saveData(structuredClone(draft),editParents);dirty=false;editParents=(archive.heads()[draft.id]||[]).map(o=>o.id);
  close();location.hash='bets';render();toast('Giocata salvata'+(drive.token?' · sincronizzazione avviata':' su questo dispositivo')+'.');
 }
 if(f.id==='lockForm'){if(blockedLeg(draft,+f.dataset.index))throw Error('Incontro bloccato: multipla già conclusa.');let amount=Number($('#lockedAmount').value),q=Number($('#lockedQuote').value),c=Number($('#lockedComm').value);if(!(amount>=0&&q>1&&c>=0&&c<100))throw Error('Verifica importo, quota e commissione.');Object.assign(draft.legs[+f.dataset.index],{locked:true,amount:round(amount),fixedLay:q,fixedComm:c,lay:q});dirty=true;close();render();}
 if(f.id==='movementForm'){let v=id=>$('#'+id).value,m={id:crypto.randomUUID(),type:'movement',identity:v('mIdentity'),book:v('mBook'),kind:v('mKind'),amount:round(Number(v('mAmount'))),date:v('mDate'),to:v('mTo'),note:v('mNote')};if(!(m.amount>0))throw Error('Inserisci un importo positivo.');if(m.kind==='transfer'&&m.to===m.book)throw Error('Scegli un account di destinazione diverso.');if(m.kind==='initial'&&all('movement').some(x=>x.kind==='initial'&&x.identity===m.identity&&x.book===m.book))throw Error('Il saldo iniziale è già presente per questo account. Correggilo dai movimenti.');saveData(m);close();render();toast('Movimento registrato.');}
 if(f.id==='configForm'){saveSettingsForm(f);render();toast('Impostazioni salvate su questo dispositivo'+(drive.token?' · sincronizzazione avviata.':'.'));}
 if(f.id==='feeForm'){let month=$('#feeMonth').value,amount=Number($('#feeAmount').value);if(!month||!(amount>=0))throw Error('Verifica mese e importo.');saveData({id:'fee-'+month,type:'fee',month,amount:round(amount)});render();toast('Abbonamento mensile aggiornato.');}
 }catch(err){
  if(f.id==='saveForm'){
   const error=f.querySelector('#saveError');error.textContent=err.message;error.hidden=false;error.scrollIntoView({block:'nearest',behavior:'smooth'});
  }else if(f.id==='configForm'){const error=f.querySelector('#configError');error.textContent=err.message;error.hidden=false;error.scrollIntoView({block:'nearest'});}else toast(err.message);
 }});
window.addEventListener('hashchange',render);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
archive.listeners.push(()=>{if(location.hash!=='#calculator'&&!$('#modal').open&&!$('#configForm')?.dataset.dirty)render();});
setInterval(()=>{if(drive.token)drive.sync().catch(e=>{$('#syncStatus').textContent='Da sincronizzare';});},60000);
window.addEventListener('online',()=>{if(drive.token)drive.sync().catch(e=>toast(e.message));});
if(location.protocol==='https:')prepareGoogle().catch(()=>{});
render();if(!localStorage.getItem('cm-onboarded'))modal(`<h2>Dove vuoi salvare le giocate?</h2><p class="notice">Google Drive permette di ritrovare lo stesso archivio su PC e cellulare. Premi Configura Google Drive e collega il tuo account personale.</p><p class="muted">Puoi iniziare sul dispositivo e collegare Drive in seguito. Finché non lo colleghi, i dati rimangono solo in questo browser: esporta regolarmente un backup.</p><div class="actions">${button('Inizia sul dispositivo','onboard-local')}${button('Configura Google Drive','onboard-drive','primary')}</div>`);
if(document.modelContext?.registerTool){
 const lifecycle=new AbortController();window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
 for(const tool of [{name:'read_cash_summary',description:'Legge i saldi e i risultati realizzati dell’archivio aperto.',inputSchema:{type:'object',properties:{identity:{type:'string'}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(input?.identity!==undefined&&typeof input.identity!=='string')throw Error('Identità non valida.');if(input?.identity&&!config().identities.includes(input.identity))throw Error('Identità sconosciuta.');let {bs,...summary}=totals(input?.identity||'');return summary;}},{name:'start_calculator',description:'Apre un nuovo calcolatore senza salvare una giocata. Fallisce se ci sono modifiche non salvate.',inputSchema:{type:'object',properties:{kind:{type:'string',enum:['pb','pp','multi']}},required:['kind'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!Object.hasOwn(kinds,input?.kind))throw Error('Calcolatore non valido.');if(dirty)throw Error('Salva prima la giocata aperta.');newCalc(input.kind);return {opened:input.kind,saved:false};}}]){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}}
}
</script></body></html>
